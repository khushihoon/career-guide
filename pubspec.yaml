name: ai_career_app
description: AI Career App — Find AI jobs, learn skills, chat with AI mentor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  lottie: ^3.0.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  webview_flutter: ^4.7.0
  firebase_core: ^4.9.0
  email_validator: ^3.0.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.0.0
  file_picker: ^10.1.9
  flutter_local_notifications: ^17.2.2
  firebase_messaging: ^16.3.0
  cloud_functions: ^6.0.0
  cached_network_image: ^3.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png
    - assets/images/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"   
  min_sdk_android: 21 